versioning:
  scheme: uri-path
  note: >-
    Each product suite versions independently in the URI path. There is no platform-wide version train and
    no version header or date-based versioning anywhere in the catalog.
  current:
  - api: opengov:permitting-licensing-v2
    version: v2
    path_prefix: /v2/{community}
  - api: opengov:permitting-licensing-v1
    version: v1
    path_prefix: /v1
    status: superseded by v2
  - api: opengov:procurement-v2
    version: v2
  - api: opengov:procurement-v1
    version: v1
    status: superseded by v2
  - api: opengov:purchase-order
    version: 1.0.0
    path_prefix: /api/v1/po
  - api: opengov:receipt
    version: 1.0.0
  - api: opengov:vendor-management
    version: 1.0.0
  - api: opengov:budgeting-performance
    version: 1.0.0
  - api: opengov:enterprise-asset-management
    version: 1.0.0
    path_prefix: /api/v1
  - api: opengov:open-data
    version: '2.9'
    note: CKAN Action API version
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  gap: >-
    OpenGov publishes no deprecation policy, no sunset timeline, and declares no `deprecated: true`
    operation in any of the ten OpenAPI definitions — even though two suites (Permitting & Licensing and
    Procurement) already ship a superseded v1 alongside a current v2. There is no RFC 8594 Sunset or
    Deprecation header support. An integrator on v1 has no published signal about when it goes away.
