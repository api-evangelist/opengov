  note: >-
    No public SLA or uptime commitment is published on opengov.com or the developer portal. The status page
    reports observed 90-day uptime (100.0% for most suites, 99.88% for Government App Builder, #311 and
    Grants Management as observed on 2026-08-04) but that is a measurement, not a commitment.
