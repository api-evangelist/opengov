apis:
- aid: opengov:permitting-licensing-v2
  name: OpenGov Permitting & Licensing API v2
  description: 'The Permitting & Licensing (PLC) public API v2 provides programmatic access to permitting,
    licensing and code enforcement workflows for a community: records, record types, workflow steps (approval,
    document, inspection, payment), inspections and checklists, locations, projects, ledger entries, transactions,
    files and attachments with versioning, change requests, collections, guests and users, and activity
    logs. It is JSON:API shaped (application/vnd.api+json), uses filter[] query syntax with gt/lt comparison
    operators, and is community-scoped via a {community} path parameter.'
  humanURL: https://developer.opengov.com/catalog/plc-api
  baseURL: https://api.plce.opengov.com/plce
  tags:
  - Permitting
  - Licensing
  - Code Enforcement
  - Inspections
  - Government
  properties:
  - type: OpenAPI
    url: openapi/opengov-permitting-licensing-v2-openapi.yml
  - type: Documentation
    url: https://developer.opengov.com/docs/plc/overview
  - type: APIReference
    url: https://developer.opengov.com/catalog/plc-api
  - type: ChangeLog
    url: https://developer.opengov.com/docs/plc/changelog
