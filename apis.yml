- aid: opengov:vendor-management
  name: OpenGov Vendor Management API
  description: The Vendor Management API manages the vendor lifecycle end to end — vendor CRUD, search
    and export, submission and promotion workflows, taskmaster approval actions, contacts, addresses,
    payment methods, certificates, attachments, notes, categories, saved views, entity custom fields and
    settings, bulk vendor import with validation and field remapping, and vendor recommendations and claims.
  humanURL: https://developer.opengov.com/catalog/vm-api
  baseURL: https://api.vendor.opengov.com
  tags:
  - Vendor Management
