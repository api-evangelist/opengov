aid: opengov
name: OpenGov
description: OpenGov builds cloud enterprise resource planning and public service software for state and
  local government, serving more than 2,000 communities across budgeting and performance, financial management,
  procurement and contract management, vendor management, permitting and licensing, enterprise asset management,
  tax and revenue, utility billing, grants management, 311 request management and open data. The OpenGov
  Public Service Platform exposes a public developer portal at developer.opengov.com with a catalog of
  ten OpenAPI 3.x definitions covering roughly 358 operations, an integration/app model with scoped permissions
  and per-integration API keys, a JSON:API-shaped Permitting & Licensing API, a webhook event catalog
  of 31 Permitting & Licensing events, SCIM 2.0 identity provisioning, and an in-browser API test console.
url: https://raw.githubusercontent.com/api-evangelist/opengov/refs/heads/main/apis.yml
image: https://opengov.com/wp-content/uploads/2025/02/opengov-2025.svg
x-type: company
x-source: harvest:secondary-market
