- aid: opengov:opengov-datasets-api
  name: OpenGov Datasets API
  description: "**Datasets** are collections of data that can be retrieved using the API.\n\nDatasets\
    \ can be retrieved by using `GET` requests. The base url for datasets is `https://api.procurement.opengov.com/gateway/datasets/v1/`\n\
    \nNote: All dates and times returned by this API are in the time zone selected by the agency.\n##\
    \ Datasets Legacy Authentication Methods\nIn addition to the OpenGov standard Authorization header,\
    \ for historic purposes we support two additional ways for the Datasets APIs.\n### 1. HTTP Basic Auth\n\
    \nUse your OpenGov account email as the username and your API key as the password.\n\n```bash curl\
    \ -u \"alice@example.com:YOUR_API_KEY\" \\ https://api.procurement.opengov.com/gateway/datasets/v1/solicitations\
    \ ```\n### 2. X-api-key header\n\nYou may also authenticate using the `x-api-key` request header:\n\
