- aid: opengov:enterprise-asset-management
  name: OpenGov Enterprise Asset Management API
  description: The Enterprise Asset Management (EAM, formerly Cartegraph) REST API provides generic business-object
    CRUD over classes (assets, work orders, requests, resources), class metadata and layouts, targeted
    lists, attachments, file import/export, scenario commands and asset swaps. It authenticates with a
    session cookie rather than the platform integration API key used by the rest of the OpenGov catalog.
  humanURL: https://developer.opengov.com/catalog/eam-api
  x-baseURL-note: OpenGov publishes no default production host for EAM — the OpenAPI servers[] entry is
    the tenant template {serverURL}, which each customer replaces with their own EAM server URL.
  tags:
  - Enterprise Asset Management
  - Public Works
  - Government
  properties:
  - type: OpenAPI
    url: openapi/opengov-enterprise-asset-management-openapi.yml
  - type: Documentation
    url: https://developer.opengov.com/docs/eam/overview
  - type: APIReference
    url: https://developer.opengov.com/catalog/eam-api
  - type: ChangeLog
    url: https://developer.opengov.com/docs/eam/changes-log
  - type: Overlay
    url: overlays/opengov-enterprise-asset-management-overlay.yaml
- aid: opengov:open-data
  name: OpenGov Open Data CKAN Action API
  description: OpenGov Open Data portals expose the CKAN Action API (v2.9) at /api/3/action — package,
    resource, organization, group, tag and system actions for publishing and querying open government
    datasets. Each customer runs it on their own Open Data portal hostname; the published spec uses cloudcity.ogopendata.com
    as the example server.
  humanURL: https://developer.opengov.com/catalog/opendata-public-api
  baseURL: https://cloudcity.ogopendata.com/api/3/action
  tags:
  - Open Data
  - CKAN
