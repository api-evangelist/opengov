gaps:
- No /.well-known/security.txt (RFC 9116) is served on any OpenGov host, even though opengov.com/security/
  publishes a full responsible-disclosure policy with a security@opengov.com contact and safe-harbor terms.
  Publishing security.txt at https://opengov.com/.well-known/security.txt would make that policy
  machine-discoverable.
- No /.well-known/api-catalog (RFC 9727) is served, even though developer.opengov.com publishes ten OpenAPI
  definitions at stable /catalog/<api>/<version>/schema.yaml URLs — an api-catalog document would make the
  whole catalog discoverable without scraping the portal bundle.
- No A2A agent card at /.well-known/agent-card.json on any host.
