note: >-
  OpenGov keeps a separate changelog per product suite rather than one platform changelog. /docs/changelog
  is a one-line stub. Only the Permitting & Licensing changelog carries dated entries; Vendor Management
  lists an undated initial release and Enterprise Asset Management states no changes since 2021. Recent
  window only — the live pages are the source of truth.
scheme: dated-entries (per suite), no semantic version tags on the platform APIs
