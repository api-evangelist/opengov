finding: >-
  OpenGov publishes NO first-party API client SDK in any language. The developer portal ships no SDK page,
  no code-generation instructions and no client library links; the quickstart teaches raw curl against each
  base URL. The github.com/opengov organization holds 47 repositories, all of which are infrastructure
  forks (terraform providers, helm charts, Ruby gems like roo/cancancan/acts_as_paranoid, EKS AMI packer
  configs) — none is an OpenGov API client. The @opengov npm scope is real and first-party but publishes
  internal front-end libraries (design tokens, React components), not API clients. Recorded honestly: no
  `SDKs` pointer is wired in apis.yml, because wiring one for a design-token package would credit an SDK
  surface that does not exist.

