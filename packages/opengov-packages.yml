gap: >-
  Ten OpenAPI 3.x definitions and roughly 358 operations are published with no generated client in any
  language. Because the specs are already public at stable /catalog/<api>/<version>/schema.yaml URLs, an
  openapi-generator pipeline producing TypeScript, Python and C# clients would be a small step for OpenGov
  and would close both the sdk_count_1 and sdk_count_3 checks at once.
