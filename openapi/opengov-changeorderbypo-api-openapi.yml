components:
  schemas:
    OperationErrorEntityType:
      type: string
      enum:
      - PO
      - CO
      title: Whether the error belongs to a PO or a CO
    OperationErrorPhase:
      type: string
      title: Operation error phase
    OperationErrorCode:
      type: string
      title: Operation error code
    CoChangeKind:
      type: string
      enum:
      - Modify
      - Delete
      description: 'Change order line/split change kind: Modify (apply delta) or Delete (remove row)'
      title: CO Change Kind
    ISODate:
      type: string
      description: a string matching the pattern ^\d{4}-\d{2}-\d{2}$
      title: ISO Date (YYYY-MM-DD)
      pattern: ^\d{4}-\d{2}-\d{2}$
    LineItemType:
      type: string
      enum:
      - Item
      - Service
      - Tax
      - Discount
      - Freight
      - Miscellaneous
      description: 'Line item type: Item, Service, Tax, Discount, Freight, Miscellaneous'
      title: Line Item Type
    ValueOrPercent:
      type: string
      enum:
      - Value
      - Percent
      description: Indicates whether the input is an absolute value or a percentage
      title: Value or Percent
    NumberFromString:
      type: string
      description: a string to be decoded into a number
    OperationErrorSeverity:
      type: string
      title: Operation error severity
    OperationErrorModel.json:
      type: object
      required:
      - id
      - entityType
      - coId
      - errorCode
      - errorPhase
      - triggerAction
      - severity
      - message
      - context
      - createdAt
      properties:
        id:
          type: number
        entityType:
          $ref: '#/components/schemas/OperationErrorEntityType'
        coId:
          anyOf:
          - type: number
          - type: 'null'
        errorCode:
          $ref: '#/components/schemas/OperationErrorCode'
        errorPhase:
          $ref: '#/components/schemas/OperationErrorPhase'
        triggerAction:
          $ref: '#/components/schemas/EncumbranceTrigger'
        severity:
          $ref: '#/components/schemas/OperationErrorSeverity'
        message:
          type: string
        context:
          $id: /schemas/unknown
          title: unknown
        createdAt:
          type: string
      additionalProperties: false
      title: OperationErrorModel.json
    EncumbranceTrigger:
      type: string
      title: Trigger action that caused the error
    CoChangeType:
      type: string
      enum:
      - LineModified
      - LineAdded
      description: 'Change order line change type: LineModified, LineAdded'
      title: CO Change Type
  securitySchemes:
    platformApiKey:
      description: OpenGov Platform API Key
      type: apiKey
      name: Authorization
      in: header
    platformBearerToken:
      type: http
      scheme: bearer
