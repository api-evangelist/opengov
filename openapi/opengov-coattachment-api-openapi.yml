      description: Creates a po_attachments row with purpose=GENERAL, po_change_order_id=:coId, upload_status=INITIATED and returns a presigned S3 PUT URL. The CO must belong to the PO and be in Draft. Storage key uses the CO-scoped key shape (`${entityId}/${poId}/co/${coId}/general/...`).
      summary: Initialize a CO-scoped general file upload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRaw'
        required: true
