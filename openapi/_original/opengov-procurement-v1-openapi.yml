components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
    xApiKeyHeaderAuth:
      type: apiKey
      in: header
      name: x-api-key
    APIKey:
      type: apiKey
      in: header
      name: Authorization
      description: 'Format: `Token your-api-key-here`'
    BearerToken:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Enter Bearer Token without Bearer prefix
  schemas:
    Contract:
      x-tags:
        - Datasets
      type: object
      properties:
        vendor_name:
          type: string
          description: >
            If vendor subscriber is chosen as the Associated Vendor during
            contract record creation, this will be the company name from the
            vendor's company profile.


            If no vendor subscriber is chosen, this is the Vendor Name as
            entered into the new contract form.
          example: Acme Corp
        vendor_email:
          type: string
          description: >
            If vendor subscriber is chosen as the Associated Vendor during
            contract creation, this is copied from that vendor subscriber's user
            profile.


            If no vendor subscriber is chosen, this is the Vendor Email as
            entered into the new contract form.
          example: contact@acme.nil
        vendor_city:
          type: string
          description: >-
            Vendor company city; only available when vendor subscriber is chosen
            as the Associated Vendor during contract creation.
          example: New York
        vendor_state:
          type: string
          description: >-
            Vendor company state; only available when vendor subscriber is
            chosen as the Associated Vendor during contract creation.
          example: NY
        vendor_country:
          type: string
          description: >-
            Vendor company country; only available when vendor subscriber is
            chosen as the Associated Vendor during contract creation.
          example: USA
        vendor_zip_code:
          type: string
          description: >-
            Vendor company zip code; only available when vendor subscriber is
            chosen as the Associated Vendor during contract creation.
          example: 10001
        external_vendor_id:
          type: string
          description: >-
            The optional External Vendor ID that identifies the Vendor in your
            financial system.
          example: VENDOR-001
        vendor_number:
          type: string
          description: >-
            The optional Vendor Assigned Number that identifies the Vendor in
            your ERP.
          example: ACME-001
        internal_contract_id:
          type: integer
          description: The internal OpenGov contract ID.
          example: 456
        contract_title:
          type: string
          description: The title of the contract.
          example: Office Supplies Contract
        contract_id:
          type: string
          description: The public-facing contract ID or code.
          example: CON-789
        external_reference_id:
          type: string
          description: >-
            The optional External Reference ID that identifies the Contract in
            your financial system.
          example: EXT-CON-001
        requisition_id:
          type: string
          description: The requisition ID.
          example: REQ-101
        term_type:
          type: string
          description: 'One of: Limited Term, Continuous, or Upon Completion.'
          example: Continuous
        status:
          type: string
          description: 'One of: upcoming, active, ended.'
          example: active
        start_date:
          type: string
          format: date
          description: The start date of the contract.
          example: '2024-01-01'
        end_date:
          type: string
          format: date
          description: The end date of the contract.
          example: '2024-12-31'
        initial_term_length:
          type: integer
          description: The initial term length of the contract.
          example: 12
        initial_term_unit:
          type: string
          description: >-
            The unit of the initial term length. One of: years, months, weeks,
            days
          example: Months
        has_renewal_option:
          type: boolean
          description: >-
            If any renewal options have not been activated, value is 1.
            Otherwise 0.
          example: 1
        renewals:
          type: integer
          description: Count of all renewal options (both activated and not activated).
          example: 2
        renewals_remaining:
          type: integer
          description: Count of renewal options that have not been activated.
          example: 1
        contract_amount:
          type: number
          format: double
          description: The total amount of the contract.
          example: 10000
        amount_spent:
          type: number
          format: double
          description: Contract Spend - total of Amount Issued for all orders.
          example: 5000
        department:
          type: string
          description: The department primarily responsible for the contract.
          example: Finance
        project_contact:
          type: string
          description: First Name + Last Name of the Project Contact.
          example: John Doe
        procurement_contact:
          type: string
          description: First Name + Last Name of the Procurement Contact.
          example: Jane Smith
        contract_type:
          type: string
          description: >-
            Comma-separated list of Contract Type tags. Each tag name may be up
            to 256 characters.
          example: General
        procurement_classification:
          type: string
          description: >-
            Comma-separated list of Procurement Classification tags. Each tag
            name may be up to 256 characters.
          example: Goods
        category_codes:
          type: string
          description: >-
            Comma-separated list of Category codes. Each code may be up to 8
            characters.
          example: 1234
        notes:
          type: string
          description: Internal notes about the contract. Contains HTML formatting.
          example: Notes about the contract
        is_active_for_financial_transactions:
          type: boolean
          description: >-
            Whether a contract is available for selection in financial
            workflows, such as purchase requests.
          example: 1
        is_public:
          type: boolean
          description: Whether or not the contract is included in the public portal.
          example: 1
        allows_cooperative:
          type: boolean
          description: >-
            Whether or not the contract contains cooperative or “piggyback”
            language.
          example: 1
        acquired_via_cooperative:
          type: boolean
          description: Whether or not the contract was acquired via cooperative purchasing.
        will_rebid:
          type: boolean
          description: Contract will be renewed through a competitive process when it ends.
          example: 0
        is_emergency:
          type: boolean
          description: This is a contract for emergency goods or services.
          example: 0
        assembled_contract_document_count:
          type: integer
          description: >-
            Count of assembled contract documents (linked contract document
            projects).
          example: 5
        contract_document_count:
          type: integer
          description: Count of contract document attachments (both public and non-public).
          example: 10
        created_at:
          type: string
          format: date
          description: The creation date of the contract.
          example: '2024-01-01'
        updated_at:
          type: string
          format: date
          description: The last update date of the contract.
          example: '2024-01-25'
    ContractDocument:
      x-tags:
        - Datasets
      type: object
      properties:
        internal_project_id:
          type: integer
          description: The internal OpenGov contract document ID.
          example: 12345
        title:
          type: string
          description: The title of the document.
          example: Carroll Bog Boardwalk Construction
        project_id:
          type: string
          description: External identifier for the project.
          example: P-2024-001
        template:
          type: string
          description: Name of the document template used for the contract document.
          example: Standard Construction Template
        template_abbreviation:
          type: string
          description: Abbreviated version of the document template name.
          example: SCT
        requisition_id:
          type: string
          description: Identifier for the requisition linked to the contract  project.
          example: REQ-45678
        department:
          type: string
          description: Department responsible for the project.
          example: Facilities Management
        project_contact:
          type: string
          description: First Name + Last Name of the Project Contact.
          example: John Doe
        procurement_contact:
          type: string
          description: First Name + Last Name of the Procurement Contact.
          example: Jane Smith
        status:
          type: string
          description: 'One of: Draft, Review, Final, Closed.'
          example: Review
        status_sort:
          type: integer
          description: Numeric representation for sorting based on status.
          example: 2
        workload_points_remaining:
          type: number
          description: Number of workload points left to complete the contract document.
          example: 50.5
        created_by:
          type: string
          description: User who created the project.
          example: admin_user
        created_at:
          type: string
          format: date-time
          description: Timestamp for when the project was created.
          example: '2024-03-01 22:20:31'
        last_updated_at:
          type: string
          format: date-time
          description: Timestamp for the last update made to the project.
          example: '2024-03-03 23:29:00'
        procurement_classification:
          type: string
          description: >-
            Comma-separated list of Procurement Classification tags. Each tag
            name may be up to 256 characters.
          example: Invitation to Bid
        category_codes:
          type: string
          description: >-
            Comma-separated list of Category codes. Each code may be up to 8
            characters.
          example: 05500, 06006, 06516, 06523
        is_emergency:
          type: boolean
          description: This is a contract document for emergency goods or services.
          example: 0
        internal_contract_id:
          type: integer
          description: >-
            The internal OpenGov contract ID that this contract document is
            associated with.
          example: 12345
    ContractWithSpend:
      x-tags:
        - Datasets
      type: object
      allOf:
        - $ref: '#/components/schemas/Contract'
        - type: object
          properties:
            internal_po_id:
              type: integer
              description: Internal OpenGov unique identifier for the purchase order.
              example: 12345
            po_issue_date:
              type: string
              format: date
