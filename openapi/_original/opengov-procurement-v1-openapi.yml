    ContractOrder:
      x-tags:
        - Contracts
      type: object
      required:
        - amount
        - department
        - fiscalYear
        - issueDate
        - number
        - paidAmount
      anyOf:
        - required:
            - contractId
        - required:
            - vendorAssignedNo
      properties:
        amount:
          type: number
          description: The contract order amount.
          example: 1000.5
        contractId:
          type: string
          description: >-
            Case sensitive. The ID of the associated contract. Required if
            `vendorAssignedNo` is not provided. If there are no contract matches
            or greater than 1 match, the `vendorAssignedNo` will be required.
          maxLength: 255
          example: CONTRACT-12345
        department:
          type: string
          description: Case insensitive. The name of the department making the purchase.
          maxLength: 128
          example: finance
        description:
          type: string
          description: An optional description of the contract order.
          maxLength: 500
          example: Purchase of office supplies.
        fiscalYear:
          type: string
          description: >-
            Case insensitive. The fiscal year associated with the contract
            order.
          maxLength: 256
          example: fy2024-2025
        issueDate:
          type: string
          format: date
          description: >-
            The date the contract order was approved and issued. Most common
            date formats are accepted. Ex. `YYYY-MM-DD` or `MM/DD/YYYY`.
          example: '2023-10-01'
        notes:
          type: string
          description: Optional notes for the contract order.
          maxLength: 500
          example: Urgent request.
        number:
          type: string
          description: Case sensitive. The contract order number.
          maxLength: 64
          example: PO-987654
        paidAmount:
          type: number
          description: The amount that has been paid so far.
          example: 500
        vendorAssignedNo:
          type: string
          description: >-
            Case sensitive. The vendor assigned number for this contract order.
