  /public/api/v1/contracts:
    get:
      description: >-
        This endpoint fetches a list of contracts, ordered by their ID, and
        supports cursor-based pagination.
      operationId: ListContractsV1Controller_listContracts
      parameters:
        - name: first
          required: false
          in: query
          description: The number of contracts to return.
          schema:
            default: 5
            example: 10
            type: number
        - name: after
          required: false
          in: query
          description: A cursor for use in pagination.
          schema:
            example: Y29udHJhY3QuaWQ9MQ==
            type: string
        - name: startDateAfter
          required: false
          in: query
          description: Filters out all contracts with startDate after this date (ISO8601).
          schema:
            example: '2025-01-01'
            type: string
        - name: startDateBefore
          required: false
          in: query
          description: Filters out all contracts with startDate before this date (ISO8601).
          schema:
            example: '2025-01-01'
            type: string
        - name: createdDateAfter
          required: false
          in: query
          description: Filters out all contracts with created_at after this date (ISO8601).
          schema:
            example: '2025-01-01'
            type: string
        - name: createdDateBefore
          required: false
          in: query
          description: >-
            Filters out all contracts with created_at before this date
            (ISO8601).
          schema:
            example: '2025-01-01'
            type: string
        - name: endDateAfter
          required: false
          in: query
          description: Filters out all contracts with endDate after this date (ISO8601).
          schema:
            example: '2025-01-01'
            type: string
        - name: endDateBefore
          required: false
          in: query
          description: Filters out all contracts with endDate before this date (ISO8601).
          schema:
            example: '2025-01-01'
            type: string
        - name: updatedDateAfter
          required: false
          in: query
          description: Filters out all contracts updated after this date (ISO8601).
          schema:
            example: '2025-01-01'
            type: string
        - name: updatedDateBefore
          required: false
          in: query
          description: Filters out all contracts updated before this date (ISO8601).
          schema:
            example: '2025-01-01'
            type: string
        - name: sortByAsc
          required: false
          in: query
          description: >-
            Sorts, in ascending order, the final list by the valid contract
            field
          schema:
            example: title
            type: string
        - name: sortByDesc
          required: false
          in: query
          description: >-
            Sorts, in descending order, the final list by the valid contract
            field
          schema:
            example: title
            type: string
        - name: externalVendorId
          required: false
          in: query
          description: >-
            Filters contracts by External Vendor ID (case-insensitive substring
            match).
          schema:
            example: vendor-123
            type: string
      responses:
        '200':
          description: A paginated list of contracts was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListContractsResponseDto'
        '400':
          description: The request parameters are invalid.
          content:
            application/json:
              examples:
                Invalid `first` parameter (not an integer):
                  value:
                    statusCode: 400
                    message:
                      - '`first` query parameter must be an integer'
                    error: Bad Request
                Invalid `first` parameter (negative value):
                  value:
                    statusCode: 400
                    message:
                      - '`first` query parameter must be a non-negative number'
                    error: Bad Request
                Malformed `after` cursor:
                  value:
                    statusCode: 400
                    message: >-
                      Invalid `after` cursor, please only use cursors generated
                      by this API
                    error: Bad Request
                Filtering startDate misordered:
                  value:
                    statusCode: 400
                    message: startDateBefore is earlier than startDateAfter
                    error: Bad Request
                Attempting to sort by invalid field:
                  value:
                    statusCode: 400
                    message: Attempting to sort by invalid field id
                    error: Bad Request
                Attempting to sort both ascending and descending:
                  value:
                    statusCode: 400
                    message: Provide only one of sortByAsc or sortByDesc
                    error: Bad Request
                General request validation errors:
                  value:
                    statusCode: 400
                    message: Validation error on query parameter property
                    error: Bad Request
        '401':
          content:
            application/json:
              examples:
                Missing Authorization Header:
                  value:
                    statusCode: 401
                    message: Authorization header not found
                    error: Unauthorized
                Missing Authorization Value:
                  value:
                    statusCode: 401
                    message: Authorization header value not found
                    error: Unauthorized
                Invalid Authorization Header:
                  value:
                    statusCode: 401
                    message: Invalid authorization header
                    error: Unauthorized
                Token Verification Failed:
                  value:
                    statusCode: 401
                    message: Token verification failed
                    error: Unauthorized
                API Key Authentication Failed:
                  value:
                    statusCode: 401
                    message: API key authentication failed
                    error: Unauthorized
                Incomplete User Information:
                  value:
                    statusCode: 401
                    message: >-
                      User or entity information incomplete: userUUID=undefined,
                      entityUUID=undefined
                    error: Unauthorized
                Failed to Get Entitlements:
                  value:
                    statusCode: 401
                    message: Failed to get entitlements
                    error: Unauthorized
          description: ''
        '403':
          content:
            application/json:
              examples:
                Missing Required Entitlements:
                  value:
                    statusCode: 403
                    message: >-
                      Required entitlements not found:
                      PLATFORM_ADMIN_SETTINGS_ENTITLEMENT, PRO_ENTITLEMENT
