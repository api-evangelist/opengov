openapi: 3.1.0
info:
  version: v1
  title: Procurement & Contract Management APIs
  x-logo:
    url: https://assets.procurement.opengov.com/brand/pro-logo-padded.png
  description: >
    This documentation describes the v1 OpenGov Procurement public APIs. A new
    v2 surface

    is also available — use the version selector above to view it.


    ### Why v2 exists


    v1 paths (`/gateway/datasets/v1/...`, `/gateway/contract-orders/v1`) act on
    the entity

    that your API key was issued for. If your OpenGov account has access to more
    than one

    entity, v1 cannot choose between them — it always uses the entity associated
    with the

    API key.


    v2 takes the entity explicitly as a path parameter, so the same API key can
    act on any

    entity your account has access to:


    `/gateway/v2/entities/{entityUuid}/datasets/contracts`


    If your account only has access to one entity, you can continue to use v1
    with no

    behavior change. New integrations should target v2.


    ### Migration signals on v1 responses


    If your OpenGov account has access to more than one entity, v1 success
    responses include

    the following headers as a migration hint:


    - `Deprecation: true`

    - `Link:
    <https://api.procurement.opengov.com/gateway/v2/entities/{your-entity-uuid}/...>;
    rel="successor-version"`

    - `Warning: 299 - "This API key has access to multiple entities. Use
    /gateway/v2/entities/:entityUuid/... to target a specific one."`


    The `Link` header points at the v2 equivalent of the request you just made,
    with the

    entity associated with your API key pre-filled — use it as your migration
    target.

    Accounts with access to a single entity will not see these headers.
servers:
  - url: https://api.procurement.opengov.com
    description: Production
tags:
  - name: Datasets
    description: >
      **Datasets** are collections of data that can be retrieved using the API.


      Datasets can be retrieved by using `GET` requests. The base url for
      datasets is `https://api.procurement.opengov.com/gateway/datasets/v1/`


      Note: All dates and times returned by this API are in the time zone
      selected by the agency.

      ## Datasets Legacy Authentication Methods

      In addition to the OpenGov standard Authorization header, for historic
      purposes we support two additional ways for the Datasets APIs.

      ### 1. HTTP Basic Auth


      Use your OpenGov account email as the username and your API key as the
      password.


      ```bash curl -u "alice@example.com:YOUR_API_KEY" \
      https://api.procurement.opengov.com/gateway/datasets/v1/solicitations ```

      ### 2. X-api-key header


      You may also authenticate using the `x-api-key` request header:

      ```bash curl -H "x-api-key: YOUR_API_KEY" \
      https://api.procurement.opengov.com/gateway/datasets/v1/solicitations ```

      > **Security note:** Some third-party systems may log or store custom
      headers in plaintext.  


      To obtain an API key, please follow the steps outlined in this guide
      [OpenGov Procurement API
      Reference](https://opengov.my.site.com/support/s/article/87a452ae-254c-4b62-8336-d475c2e30723)
      or contact OpenGov support.


      The API will return a 401 error if the key is invalid.
    x-displayName: Datasets
  - name: Contracts
    x-displayName: Contracts
  - name: Categories
    x-displayName: Categories
  - name: Tags
    x-displayName: Tags
paths:
  /gateway/contract-orders/v1:
    post:
      tags:
        - Contracts
      summary: Import Contract Orders
      operationId: importContractOrders
      security:
        - basicAuth: []
        - apiKeyAuth: []
        - xApiKeyHeaderAuth: []
      requestBody:
        description: A JSON array of Contract Orders to be imported.
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ContractOrder'
      responses:
        '200':
          description: Successfully updated one or more Contract Orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdCount:
                    type: integer
                    example: 2
                    description: Number of Contract Orders created.
                  updatedCount:
                    type: integer
                    example: 1
                    description: Number of Contract Orders updated.
                  erroredContractOrders:
                    type: array
                    description: List of Contract Orders that encountered errors.
                    items:
                      $ref: '#/components/schemas/ErroredContractOrder'
        '201':
          description: Successfully created one or more Contract Orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdCount:
                    type: integer
                    example: 2
                    description: Number of Contract Orders created.
                  updatedCount:
                    type: integer
                    example: 1
                    description: Number of Contract Orders updated.
                  erroredContractOrders:
                    type: array
                    description: List of Contract Orders that encountered errors.
                    items:
                      $ref: '#/components/schemas/ErroredContractOrder'
        '400':
          description: Bad request, invalid or empty body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: No valid contract orders to import
                  erroredContractOrders:
                    type: array
                    description: List of Contract Orders that encountered errors.
                    items:
                      $ref: '#/components/schemas/ErroredContractOrder'
        '401':
          description: Unauthorized, invalid or missing token.
        '403':
          description: Forbidden, user does not have permission to import contract orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Only contract admins can import contract orders
        '404':
          description: Not Found, feature is not available in this environment.
        '500':
          description: Internal server error.
