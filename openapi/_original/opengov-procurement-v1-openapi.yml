          example: 123
        title:
          type: string
          description: The title of the contract.
          example: Annual Office Supply Contract
        startDate:
          type: string
          description: The start date of the contract in ISO 8601.
          example: '2023-07-05T15:25:45.511Z'
        endDate:
          type: string
          description: The end date of the contract in ISO 8601.
          example: '2025-07-05T15:25:45.511Z'
        status:
          type: string
          description: The current status of the contract.
          example: ended
        isPublic:
          type: boolean
          description: Indicates if the contract is public.
          example: true
        isCooperative:
          type: boolean
          description: Indicates if the contract is a cooperative contract.
          example: false
        contractId:
          type: string
          description: The contract identifier string.
          example: CNTR-2023-001
        internalReferenceId:
          type: string
          description: The unique contract identifier per government
          example: '000000001'
        updated_at:
          type: string
          description: The last updated date of the contract in ISO 8601.
          example: '2025-07-05T15:25:45.511Z'
        created_at:
          type: string
          description: The created date of the contract in ISO 8601.
          example: '2025-07-04T15:25:45.511Z'
        departmentName:
          type: string
          description: The name of the department associated with the contract.
          example: Public Works
        durationType:
          type: string
          description: The type of duration for the contract.
          example: fixed
        project_id:
          type: number
          description: The project ID associated with the contract.
          example: 789
        summary:
          type: string
          description: A summary of the contract details.
          example: Supply of office materials for the year.
        state:
          type: string
          description: The current state of the contract.
          example: published
        government_id:
          type: number
          description: The ID of the government entity associated with the contract.
          example: 456
