  /public/api/v1/contracts/categories:
    get:
      description: >-
        This endpoint fetches a paginated list of categories for a given
        category set (NIGP, NAICS, or UNSPSC), ordered by ID, with cursor-based
        pagination.
      operationId: CategoriesV1Controller_listCategories
      parameters:
        - name: set
          required: true
          in: query
          description: The category set to retrieve.
          schema:
            example: nigp
            type: string
            enum:
              - nigp
              - naics
              - unspsc
        - name: first
          required: false
          in: query
          description: The number of categories to return.
          schema:
            default: 10
            example: 10
            type: number
        - name: after
          required: false
          in: query
          description: A cursor for use in pagination.
          schema:
            example: Y2F0ZWdvcnkuaWQ9MQ==
            type: string
      responses:
        '200':
          description: A paginated list of categories was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCategoriesResponseDto'
        '400':
          description: The request parameters are invalid.
          content:
            application/json:
              examples:
                Invalid `set` parameter:
                  value:
                    statusCode: 400
                    message:
                      - >-
                        `set` query parameter must be one of: nigp, naics,
                        unspsc
                    error: Bad Request
                Invalid `first` parameter (not an integer):
                  value:
                    statusCode: 400
                    message:
                      - '`first` query parameter must be an integer'
                    error: Bad Request
                Invalid `first` parameter (negative value):
                  value:
                    statusCode: 400
                    message:
                      - '`first` query parameter must be a non-negative number'
                    error: Bad Request
                Malformed `after` cursor:
                  value:
                    statusCode: 400
                    message: >-
                      Invalid `after` cursor, please only use cursors generated
                      by this API
                    error: Bad Request
        '401':
          content:
