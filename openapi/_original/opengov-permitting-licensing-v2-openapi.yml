              description: Number of remaining requests
            Location:
              description: URL of the newly created resource
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    title: File
                    required:
                    - id
                    - type
                    - attributes
                    properties:
                      id:
                        type: string
                        description: Unique internal ID of the file
                        example: file-post-response-585960
                      type:
                        type: string
                        enum:
                        - file
                        example: file
