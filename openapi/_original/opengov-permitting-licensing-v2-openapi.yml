                          activatedAt:
                            type: string
                            format: date-time
                            description: When the step was activated
                          completedAt:
                            type: string
                            nullable: true
                            format: date-time
                            description: When the step was completed
                          visible:
                            type: boolean
                            description: Indicates whether the step is visible to users
                            example: true
