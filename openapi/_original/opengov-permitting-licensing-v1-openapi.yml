      - Step Comments
  - name: Events
    tags:
      - Event Types
webhooks:
  step_status_changed:
    post:
      summary: Step status changed
      description: Occurs when the status of a step in a record's workflow changes
      operationId: step_status_changed
      tags:
        - Event Types
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/event_common_props"
                - $ref: "#/components/schemas/step_status_changed"
      responses:
        "200":
          description: >-
            Return 200 status for successfully acknowledging the webhook
            delivery
