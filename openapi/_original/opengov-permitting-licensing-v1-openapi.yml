openapi: 3.1.0
info:
  version: "v1"
  title: Permitting Licensing & Code Enforcement APIs
  x-logo:
    url: "https://viewpointcloud.blob.core.windows.net/profile-pictures/Frame_778_Sun_Nov_12_2023_17:18:36_GMT+0000_(Coordinated_Universal_Time).png"
  description: |+
    The OpenGov Permitting & Licensing API is organized around REST. The API is based on the JSON API specification and uses standard HTTP response codes, authentication, and verbs.

    ## Authentication
    The OpenGov Permitting & Licensing API is authenticated using the [OAuth2](https://www.rfc-editor.org/rfc/rfc6749) Client Credentials flow. Access tokens are provided as a [bearer token](https://datatracker.ietf.org/doc/html/rfc6750) Authorization header in all API requests.

    To obtain an access token, you must have an OpenGov-provided **Client ID** and **Client Secret** and make a POST request to https://accounts.viewpointcloud.com/oauth/token

    Example request:

    ```bash
    curl --request POST \
      --url https://accounts.viewpointcloud.com/oauth/token \
      --header 'content-type: application/x-www-form-urlencoded' \
      --data 'grant_type=client_credentials' \
      --data 'client_id=YOUR_CLIENT_ID' \
      --data 'client_secret=YOUR_CLIENT_SECRET' \
      --data 'audience=viewpointcloud.com/api/production'
    ```

    The response will include:
    - `access_token`: Access token issued by the authorization server
    - `token_type`: Type of token issued (typically `Bearer`)
    - `expires_in`: The lifetime in seconds of the access token
    <br />
    <br />
    The API will return a 401 error if a token is invalid.
    <br />
    <br />
servers:
  - url: https://api.plce.opengov.com/plce
    description: Production
tags:
  - name: Records
    description: |2+
      **Records** are created in the OpenGov Permitting & Licensing Employee Portal and/or Citizen Portal.
      
      A **Record** can have a **Form**, a **Workflow**, one or more public **Contacts** (the applicant and any guests), and one or more **Locations**.

  - name: Record Form
    description: |2+
      A Record's **Form** is based on its **Record Type**.
      
      A Form is comprised of **Fields** which are contained within **Sections**. Each Field is of a specific data Type, and has a **Label** and a **Value**.
  - name: Record Contacts
    description: |2+
      A Record can have one **Applicant** and up to 99 **Guests**.
      
      The Applicant is the public user who submitted a Record. The Applicant or any employee user can add Guests to a Record.

  - name: Record Locations
    description: |2+
      A Record can be associated with one **Primary Location** and up to 99 **Additional Locations**.
      
      Record Locations reference **Locations**.
  - name: Steps
    description: |2+
      A Record's Workflow is represented as a collection of **Steps**. Steps are automatically created on a Record at the time it is submitted, based on the Workflow Template defined in the Record Type settings of that Record's Type.
      
      Steps are instantiated on Records and can be added or deleted on individual Records, so a given Record's Steps may not always match its Workflow Template.

  - name: Step Comments
    description: |2+
      A Record Step can have **Comments**, which are visible to public Record Contacts, and **Internal Notes**, which are visible to employees only.

      Comments send Notifications to any employee assigned to a step.
  - name: Event Types
    description: This is a list of all the types of events we currently send. We may add more at any time, so in developing and maintaining your code, you should not assume that only these types exist.
x-tagGroups:
  - name: Records
    tags:
      - Records
      - Record Contacts
      - Record Locations
      - Record Form
  - name: Workflow
    tags:
