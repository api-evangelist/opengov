      description: Closes one or more line items on an Issued PO. Liquidates remaining encumbrance on closed lines (split → line item → PO rollup). Auto-closes the PO with 'Auto-Closed' label when all non-deleted lines are closed. Already-closed lines are silently skipped. Returns 204 No Content on success.
