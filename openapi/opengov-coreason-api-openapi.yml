      description: Creates a new Change Order reason for the entity. Code must be unique per entity. Returns 201 on success.
      summary: Create a new CO reason
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - label
              properties:
                code:
                  type: string
                  description: a string at most 64 character(s) long
                  title: maxLength(64)
                  minLength: 1
                  maxLength: 64
                label:
                  type: string
                  description: a string at most 256 character(s) long
                  title: maxLength(256)
                  minLength: 1
                  maxLength: 256
              additionalProperties: false
        required: true
