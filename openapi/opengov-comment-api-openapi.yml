      description: Creates a text-only comment, attachment-only entry, or mixed comment+attachments. All writes are transactional. Mentions are extracted from body_html.
      summary: Create a comment or attachment-only entry
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                body:
                  anyOf:
                  - type: object
                    required:
                    - html
                    properties:
                      html:
                        type: string
                        description: a string at most 51200 character(s) long
                        title: maxLength(51200)
                        maxLength: 51200
                    additionalProperties: false
                  - type: 'null'
                visibilityScope:
                  type: string
                  enum:
                  - INTERNAL
                  - EXTERNAL
                lineItemId:
                  anyOf:
                  - type: number
                  - type: 'null'
                attachmentIds:
                  type: array
                  items:
                    type: number
                  description: an array of at most 100 item(s)
                  title: maxItems(100)
                  maxItems: 100
              additionalProperties: false
        required: true
