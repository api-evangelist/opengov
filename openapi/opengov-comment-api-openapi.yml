      description: Soft-deletes the comment, all linked attachments, and hides associated activity log entries. Creator-only. PO must not be in a terminal status.
      summary: Delete a comment (soft-delete with cascade)
components:
  schemas:
    NumberFromString:
      type: string
      description: a string to be decoded into a number
    ActivityLogEntryType:
      type: string
      enum:
      - COMMENT
      - ATTACHMENT
      - ATTACHMENT_GROUP
      - PRINT
      - PO_COPIED
      - CO_CREATED
      - CO_SUBMITTED
      - CO_APPROVED
      - CO_REJECTED
      - CO_CANCELLED
      - CO_LINE_ADDED
      - CO_LINE_MODIFIED
      - CO_PURCHASE_DETAILS_CHANGED
      - CO_COMMENT_ADDED
      - CO_ATTACHMENT_ADDED
      - CO_ATTACHMENT_REMOVED
      - ATTACHMENT_TRANSFER_FAILED
      - PO_CREATED_FROM_PR
      - CO_TNC_SNAPSHOT_CREATED
      - CO_TNC_UPDATED
      - CO_TNC_APPROVAL_SYNCED
      - CO_TNC_CANCEL_ARCHIVED
      - CO_GENERAL_CANCEL_ARCHIVED
      - CO_LINE_CANCEL_ARCHIVED
      - CO_GENERAL_SNAPSHOT_CREATED
      - CO_LINE_ATTACHMENT_SNAPSHOT_CREATED
      - CO_BASELINED_FROM_PO
      - CO_APPROVAL_GENERAL_ATTACHMENTS_SYNCED
      - CO_APPROVAL_LINE_ATTACHMENTS_SYNCED
      - PO_TNC_UPDATED
      - CO_LINE_DECREASED
      - CO_LINE_REMOVED
      - CO_LINE_SPLIT_REMOVED
      - CO_LINE_REOPENED
      - CO_LINE_ATTACHMENTS_REMOVED
      title: Activity log entry type
  securitySchemes:
    platformApiKey:
      description: OpenGov Platform API Key
      type: apiKey
      name: Authorization
      in: header
    platformBearerToken:
      type: http
      scheme: bearer
