              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - claims
                    - effectiveClaims
                    properties:
                      claims:
                        type: array
                        items:
                          type: object
                          required:
                          - key
                          - domain
                          - description
