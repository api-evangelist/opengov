                              - type: 'null'
                            approvedAt:
                              anyOf:
                              - type: string
                              - type: 'null'
                            createdAt:
                              type: string
                            revisedPoTotal:
                              type: string
                            changeInTotal:
                              type: string
                            isApproved:
                              type: boolean
                          additionalProperties: false
                      persistedTerms:
                        type: object
                        required:
                        - bodyHtml
                        - attachmentIds
                        properties:
                          bodyHtml:
                            anyOf:
                            - type: string
                            - type: 'null'
                          attachmentIds:
                            type: array
                            items:
                              type: number
                        additionalProperties: false
                    additionalProperties: false
                additionalProperties: false
