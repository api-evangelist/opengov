        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - availableComments
                    - availableAttachments
                    - availableChangeOrders
                    - persistedTerms
                    properties:
                      availableComments:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - author
                          - timestamp
                          - text
                          properties:
                            id:
                              type: number
                            author:
                              type: string
                            timestamp:
                              type: string
                            text:
                              type: string
                          additionalProperties: false
                      availableAttachments:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - fileName
                          - mimeType
                          - sizeBytes
                          properties:
                            id:
                              type: number
                            fileName:
                              type: string
                            mimeType:
                              type: string
                            sizeBytes:
                              type: number
                            purpose:
                              type: string
                              enum:
                              - GENERAL
                              - TERMS_AND_CONDITIONS
                            poChangeOrderId:
                              anyOf:
                              - type: number
                              - type: 'null'
                          additionalProperties: false
                      availableChangeOrders:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - coNumber
                          - status
                          - effectiveDate
                          - approvedAt
                          - createdAt
                          - revisedPoTotal
                          - changeInTotal
                          - isApproved
                          properties:
