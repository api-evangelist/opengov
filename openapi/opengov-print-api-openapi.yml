              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 403
                  code:
                    type: string
                    description: Machine-readable error code
                    example: AuthorizationError
                  detail:
                    type: string
                    description: Human-readable error description. For 400 ValidationError with exactly one field issue, matches that field's `detail`; otherwise a summary (e.g. multiple validation issues).
                    example: You do not have permission to perform this action.
                required:
                - status
                - code
                - detail
        '404':
          description: EntityNotFoundError
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 404
                  code:
                    type: string
                    description: Machine-readable error code
                    example: PurchaseOrderNotFound
                  detail:
                    type: string
                    description: Human-readable error description. For 400 ValidationError with exactly one field issue, matches that field's `detail`; otherwise a summary (e.g. multiple validation issues).
                    example: Purchase order with id 123 was not found.
                required:
                - status
                - code
                - detail
        '500':
          description: InfrastructureError
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 500
                  code:
                    type: string
                    description: Machine-readable error code
                    example: InternalServerError
                  detail:
                    type: string
                    description: Human-readable error description. For 400 ValidationError with exactly one field issue, matches that field's `detail`; otherwise a summary (e.g. multiple validation issues).
                    example: An unexpected error occurred while processing your request. Please try again later.
                required:
                - status
                - code
                - detail
      description: 'Validates PO eligibility, computes content hash, checks S3 cache. Cache hit: returns completed with presigned URL (200). Cache miss: creates print job, forks generation, returns generating (202).'
      summary: Initiate or retrieve a print job for a Purchase Order
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - includeAttachments
              - attachmentIds
              - attachmentOrder
              - includeComments
              - commentIds
              - includeTermsAndConditions
              properties:
                includePo:
                  type: boolean
                includeChangeOrders:
                  type: boolean
                changeOrderIds:
                  anyOf:
                  - type: array
                    items:
                      type: number
                  - type: 'null'
                includeAttachments:
                  type: boolean
                attachmentIds:
                  anyOf:
                  - type: array
                    items:
                      type: number
                  - type: 'null'
                attachmentOrder:
                  anyOf:
                  - type: array
                    items:
                      type: number
                  - type: 'null'
                includeComments:
                  type: boolean
                commentIds:
                  anyOf:
                  - type: array
                    items:
                      type: number
                  - type: 'null'
                includeTermsAndConditions:
                  type: boolean
                termsAndConditions:
                  anyOf:
                  - type: string
                  - type: 'null'
              additionalProperties: false
        required: true
