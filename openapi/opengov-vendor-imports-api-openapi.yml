components:
  schemas:
    NotFoundHttpError:
      type: object
      required:
      - message
      - _tag
      properties:
        message:
          type: string
        resourceType:
          type: string
        _tag:
          type: string
          enum:
          - NotFoundHttpError
      additionalProperties: false
    ProcessImportRequest:
      type: object
      required:
      - uploadKey
      - fileName
      properties:
        uploadKey:
          type: string
          description: a string at least 1 character(s) long
          title: minLength(1)
          minLength: 1
        fileName:
          type: string
          description: a string at most 512 character(s) long
          title: maxLength(512)
          minLength: 1
          maxLength: 512
      additionalProperties: false
      description: Start an import job from a previously presigned-uploaded S3 object
    PayloadTooLargeHttpError:
      type: object
      required:
      - message
      - _tag
      properties:
        message:
          type: string
        maxSizeBytes:
          type: number
        actualSizeBytes:
          type: number
        _tag:
          type: string
          enum:
          - PayloadTooLargeHttpError
      additionalProperties: false
    TemplateDownloadResponse:
      type: object
      required:
      - downloadUrl
      - s3Key
      - fileName
      - instructions
      properties:
        downloadUrl:
          type: string
          description: Presigned S3 URL for template download
        s3Key:
          type: string
          description: S3 object key where the template is stored
        fileName:
          type: string
          description: Suggested filename for the download
        instructions:
          $ref: '#/components/schemas/TemplateInstructions'
      additionalProperties: false
      description: Template download response with presigned URL and structured instructions for UI display
      title: Template Download Response
    TemplateSheetInfo:
      type: object
      required:
      - sheetName
      - columns
      properties:
        sheetName:
          type: string
          description: Worksheet tab name
        columns:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSheetColumnInfo'
          description: Columns present on this sheet in template order
      additionalProperties: false
      description: One import template tab and its columns
      title: Template Sheet
    UnauthenticatedHttpError:
      type: object
      required:
      - message
      - _tag
      properties:
        message:
          type: string
        _tag:
          type: string
          enum:
          - UnauthenticatedHttpError
      additionalProperties: false
    PresignedUploadResponse:
      type: object
      required:
      - uploadUrl
      - uploadKey
      - expiresInSeconds
      properties:
        uploadUrl:
          type: string
          description: Presigned S3 URL for PUT upload
        uploadKey:
          type: string
          description: Opaque key to pass back to processImport
        expiresInSeconds:
          type: number
      additionalProperties: false
    Issue:
      type: object
      required:
      - _tag
      - path
      - message
      properties:
        _tag:
          type: string
          enum:
          - Pointer
          - Unexpected
          - Missing
          - Composite
          - Refinement
          - Transformation
          - Type
          - Forbidden
          description: The tag identifying the type of parse issue
        path:
          type: array
          items:
            $ref: '#/components/schemas/PropertyKey'
          description: The path to the property where the issue occurred
        message:
          type: string
          description: A descriptive message explaining the issue
      additionalProperties: false
      description: Represents an error encountered while parsing a value to match the schema
    InternalServerHttpError:
      type: object
      required:
      - message
      - _tag
      properties:
        message:
          type: string
        _tag:
          type: string
          enum:
          - InternalServerHttpError
      additionalProperties: false
    BadRequestHttpError:
      type: object
      required:
      - message
      - _tag
      properties:
        message:
          type: string
        field:
          type: string
        blockingReasons:
          type: array
          items:
            type: object
            required:
            - source
            - reason
            properties:
              source:
                type: string
              reason:
                type: string
              count:
                type: number
            additionalProperties: false
        _tag:
          type: string
          enum:
          - BadRequestHttpError
      additionalProperties: false
    TemplateInstructions:
      type: object
      required:
      - generalInstructions
      - requiredSheets
      - notes
      properties:
        generalInstructions:
          type: array
          items:
            type: string
          description: General rules for filling the import template (same as Instructions sheet)
        requiredSheets:
          type: array
          items:
            type: string
          description: Sheet names that are required and cannot be excluded
        notes:
          type: array
          items:
            type: string
          description: Short UI hints; field-level help is in the downloaded template
        sheets:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSheetInfo'
          description: 'Optional extension: when present, data sheets in the template with ordered column definitions (omitted when no template was generated)'
      additionalProperties: false
      description: General instructions, required sheets, and supplementary notes; optional sheet-wise column metadata when available
      title: Template Instructions
    EntityNotFoundError:
      type: object
      required:
      - entityId
      - _tag
      properties:
        entityId:
          type: string
        _tag:
          type: string
          enum:
          - EntityNotFoundError
      additionalProperties: false
    HttpApiDecodeError:
      type: object
      required:
      - issues
      - message
      - _tag
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        message:
          type: string
        _tag:
          type: string
          enum:
          - HttpApiDecodeError
      additionalProperties: false
      description: The request did not match the expected schema
    TemplateSheetColumnInfo:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Column header as in the template
      additionalProperties: false
      title: Template Sheet Column
    ValidationFailedHttpError:
      type: object
      required:
      - message
      - errors
      - _tag
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
            - severity
            - code
            - message
            properties:
              severity:
                type: string
                enum:
                - error
                - warning
              code:
                type: string
              message:
                type: string
              sheet:
                type: string
              row:
                type: number
              column:
                type: string
              vendorImportKey:
                type: string
            additionalProperties: false
        _tag:
          type: string
          enum:
          - ValidationFailedHttpError
      additionalProperties: false
    AuthError:
      type: object
      required:
      - _tag
      properties:
        cause:
          title: unknown
        _tag:
          type: string
          enum:
          - AuthError
      additionalProperties: false
    UnauthorizedHttpError:
      type: object
      required:
      - message
      - _tag
      properties:
        message:
          type: string
        requiredPermissions:
          type: array
          items:
            type: string
        _tag:
          type: string
          enum:
          - UnauthorizedHttpError
      additionalProperties: false
    PresignedUploadRequest:
      type: object
      required:
      - fileName
      properties:
        fileName:
          type: string
          description: a string at most 512 character(s) long
          title: maxLength(512)
          minLength: 1
          maxLength: 512
        contentType:
          type: string
      additionalProperties: false
      description: Request a presigned S3 PUT URL for direct-from-browser upload
    PropertyKey:
      anyOf:
      - type: string
      - type: number
      - type: object
        required:
        - _tag
        - key
        properties:
          _tag:
            type: string
            enum:
            - symbol
          key:
            type: string
        additionalProperties: false
        description: an object to be decoded into a globally shared symbol
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme
