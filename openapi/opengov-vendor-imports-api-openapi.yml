  /api/v1/entities/{entityId}/vendor-imports/{importId}:
    get:
      tags:
      - vendor-imports
      operationId: vendor-imports.getImportDetail
      parameters:
      - name: Authorization
        in: header
        description: JWT Bearer token for authentication
        required: true
        schema:
          type: string
          default: Bearer <your-jwt-token>
        example: Bearer <your-jwt-token>
      - name: entityId
        in: path
        schema:
          type: string
        required: true
      - name: importId
        in: path
        schema:
          type: string
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - importId
                - fileName
                - uploadedBy
                - status
                - totalVendors
                - validVendorCount
                - invalidVendorCount
                - errorCount
                - duplicateCount
                - createdAt
                - completedAt
                - processingTimeMs
                properties:
                  importId:
                    type: string
                  fileName:
                    type: string
                  uploadedBy:
                    type: string
                  importType:
                    type: string
                    enum:
                    - standard
                    - ai
                  status:
                    type: string
                    enum:
                    - parsing
                    - parsed
                    - validating
                    - validated
                    - importing
                    - imported
                    - failed
                  totalVendors:
                    type: number
                  validVendorCount:
                    type: number
                  invalidVendorCount:
                    type: number
                  errorCount:
                    type: number
                  duplicateCount:
                    type: number
                  errorReportDownloadUrl:
                    type: string
                  originalFileDownloadUrl:
                    type: string
                  filledTemplateDownloadUrl:
                    type: string
                  successReportDownloadUrl:
                    type: string
                  createdAt:
                    type: string
                  completedAt:
                    anyOf:
                    - type: string
                    - type: 'null'
                  processingTimeMs:
                    anyOf:
                    - type: number
                    - type: 'null'
                  currentStep:
                    type: string
                  preview:
                    type: object
                    required: []
                    properties: {}
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        required: []
                        properties: {}
                        additionalProperties:
                          title: unknown
                  unmapped:
                    type: object
                    required:
                    - sourceUnmappedColumns
                    - targetUnmappedColumns
                    properties:
                      sourceUnmappedColumns:
                        type: array
                        items:
                          type: string
                      targetUnmappedColumns:
                        type: array
                        items:
                          type: string
                    additionalProperties: false
                  requiredColumns:
                    type: object
                    required: []
                    properties: {}
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  validationResult:
                    type: object
                    required:
                    - isValid
                    - errors
                    - sheetSummary
                    properties:
                      isValid:
                        type: boolean
                      errors:
                        type: array
                        items:
                          type: object
                          required:
                          - severity
                          - code
                          - message
                          properties:
                            severity:
                              type: string
                              enum:
                              - error
                              - warning
                            code:
                              type: string
                            message:
                              type: string
                            sheet:
                              type: string
                            row:
                              type: number
                            column:
                              type: string
                            vendorImportKey:
                              type: string
                          additionalProperties: false
                      sheetSummary:
                        type: object
                        required: []
                        properties: {}
                        additionalProperties:
                          type: object
                          required:
                          - rowCount
                          - hasRequiredColumns
                          properties:
                            rowCount:
                              type: number
                            hasRequiredColumns:
                              type: boolean
                            missingColumns:
                              type: array
                              items:
                                type: string
                          additionalProperties: false
                    additionalProperties: false
                  error:
                    type: string
                additionalProperties: false
        '400':
          description: The request did not match the expected schema
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HttpApiDecodeError'
                - $ref: '#/components/schemas/BadRequestHttpError'
        '401':
          description: AuthError
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/UnauthenticatedHttpError'
        '403':
          description: UnauthorizedHttpError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedHttpError'
        '404':
          description: EntityNotFoundError
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/EntityNotFoundError'
                - $ref: '#/components/schemas/NotFoundHttpError'
        '500':
          description: InfrastructureError
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  required:
                  - message
                  - _tag
                  properties:
                    message:
