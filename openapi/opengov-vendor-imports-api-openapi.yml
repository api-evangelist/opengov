      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - jobId
                - importType
                - status
                properties:
                  jobId:
                    type: string
                  importType:
                    type: string
                    enum:
                    - standard
                    - ai
                  status:
                    type: string
                    enum:
                    - parsing
                additionalProperties: false
        '400':
          description: The request did not match the expected schema
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HttpApiDecodeError'
                - $ref: '#/components/schemas/BadRequestHttpError'
                - $ref: '#/components/schemas/ValidationFailedHttpError'
        '401':
          description: AuthError
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/UnauthenticatedHttpError'
        '403':
          description: UnauthorizedHttpError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedHttpError'
        '404':
          description: EntityNotFoundError
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/EntityNotFoundError'
                - $ref: '#/components/schemas/NotFoundHttpError'
        '413':
          description: PayloadTooLargeHttpError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadTooLargeHttpError'
        '500':
          description: InfrastructureError
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  required:
                  - message
                  - _tag
                  properties:
                    message:
                      type: string
                    cause:
                      not: {}
                      title: never
                    _tag:
                      type: string
                      enum:
                      - InfrastructureError
                  additionalProperties: false
                - $ref: '#/components/schemas/InternalServerHttpError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessImportRequest'
        required: true
    get:
      tags:
      - vendor-imports
      operationId: vendor-imports.listImports
      parameters:
      - name: Authorization
        in: header
        description: JWT Bearer token for authentication
        required: true
        schema:
          type: string
          default: Bearer <your-jwt-token>
        example: Bearer <your-jwt-token>
      - name: entityId
        in: path
        schema:
          type: string
        required: true
      - name: limit
        in: query
        schema:
          type: string
        required: false
      - name: offset
        in: query
        schema:
          type: string
        required: false
      - name: status
        in: query
        schema:
          type: string
        required: false
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - importId
                      - fileName
                      - fileType
                      - uploadedBy
                      - totalRecords
                      - successCount
                      - failureCount
                      - errorCount
                      - duplicateCount
                      - status
                      - createdAt
                      - completedAt
                      properties:
                        importId:
                          type: string
                        fileName:
                          type: string
                        fileType:
                          type: string
                          enum:
                          - xlsx
                          - csv
                          - txt
                        uploadedBy:
                          type: string
                        totalRecords:
                          type: number
                        successCount:
                          type: number
                        failureCount:
                          type: number
                        errorCount:
                          type: number
                        duplicateCount:
                          type: number
                        status:
                          type: string
                          enum:
                          - parsing
                          - parsed
                          - validating
                          - validated
                          - importing
                          - imported
                          - failed
                        errorReportDownloadUrl:
                          type: string
                        originalFileDownloadUrl:
                          type: string
                        createdAt:
                          type: string
                        completedAt:
                          anyOf:
                          - type: string
                          - type: 'null'
                      additionalProperties: false
                  meta:
                    type: object
                    required:
                    - total
                    - limit
                    - offset
                    properties:
                      total:
                        type: number
                      limit:
                        type: number
                      offset:
                        type: number
                    additionalProperties: false
                additionalProperties: false
        '400':
          description: The request did not match the expected schema
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HttpApiDecodeError'
                - $ref: '#/components/schemas/BadRequestHttpError'
        '401':
          description: AuthError
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/UnauthenticatedHttpError'
        '403':
          description: UnauthorizedHttpError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedHttpError'
        '404':
          description: EntityNotFoundError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityNotFoundError'
        '500':
          description: InfrastructureError
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  required:
                  - message
                  - _tag
                  properties:
                    message:
                      type: string
                    cause:
                      not: {}
                      title: never
                    _tag:
                      type: string
                      enum:
                      - InfrastructureError
                  additionalProperties: false
                - $ref: '#/components/schemas/InternalServerHttpError'
