              properties:
                columnMapping:
                  type: object
                  required: []
                  properties: {}
                  additionalProperties:
                    type: object
                    required: []
                    properties: {}
                    additionalProperties:
                      type: string
                unmappedAssignments:
                  type: object
                  required: []
                  properties: {}
                  additionalProperties:
                    type: object
                    required:
