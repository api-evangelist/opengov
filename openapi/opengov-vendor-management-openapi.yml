                      - _tag
                    properties:
                      message:
                        type: string
                      cause:
                        not: {}
                        title: never
                      _tag:
                        type: string
                        enum:
                          - InfrastructureError
                    additionalProperties: false
                  - $ref: '#/components/schemas/InternalServerHttpError'
