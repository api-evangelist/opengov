                    type: object
                    required: []
                    properties:
                      attachmentId:
                        anyOf:
                          - type: number
                          - type: 'null'
                      certificateType:
                        anyOf:
                          - type: string
                          - type: 'null'
                      certificateCategory:
                        anyOf:
                          - type: string
                          - type: 'null'
                      certificateDetails:
