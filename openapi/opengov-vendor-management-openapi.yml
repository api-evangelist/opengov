          properties:
            columns:
              type: array
              items:
                type: object
                required:
                  - name
                properties:
                  name:
                    type: string
                  visibility:
                    type: boolean
                additionalProperties: false
            search:
              type: object
              required:
                - query
                - sortBy
              properties:
                query:
                  type: object
                  required:
                    - searchString
                    - columns
                  properties:
                    searchString:
                      type: string
                    columns:
                      type: array
                      items:
                        type: string
                  additionalProperties: false
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - field
                      - operator
                    properties:
                      field:
                        type: string
                      operator:
                        type: string
                        enum:
                          - eq
                          - neq
                          - contains
                          - notContains
                          - startsWith
                          - endsWith
                          - gt
                          - gte
                          - lt
                          - lte
                          - between
                          - in
                          - notIn
                          - isNull
                          - isNotNull
                          - isEmpty
                          - isNotEmpty
                      value:
                        anyOf:
                          - type: string
                          - type: array
