                    additionalProperties: false
                paging:
                  type: object
                  required:
                    - offset
                    - limit
                  properties:
                    offset:
                      type: number
                    limit:
                      type: number
                  additionalProperties: false
                sortBy:
                  type: array
                  items:
                    type: object
                    required:
                      - field
                      - order
                    properties:
                      field:
                        type: string
                      order:
                        type: string
                        enum:
                          - asc
                          - desc
                    additionalProperties: false
