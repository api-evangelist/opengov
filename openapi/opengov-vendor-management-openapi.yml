                  anyOf:
                    - type: string
                    - type: 'null'
                paymentTermRefId:
                  anyOf:
                    - type: string
                    - type: 'null'
                paymentTerm:
                  anyOf:
                    - type: string
                    - type: 'null'
                paymentTermDesc:
                  anyOf:
                    - type: string
                    - type: 'null'
                phoneCountryCode:
                  anyOf:
