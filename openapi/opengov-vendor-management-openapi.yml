          description: a string at most 255 character(s) long
          title: maxLength(255)
          pattern: ^\S[\s\S]*\S$|^\S$|^$
          minLength: 1
          maxLength: 255
        isShared:
          type: boolean
        viewPayload:
          type: object
          required:
            - columns
