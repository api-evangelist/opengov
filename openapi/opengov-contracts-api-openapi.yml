components:
  schemas:
    ContactResponseDetails:
      type: object
      properties:
        id:
          type: number
          description: The unique identifier for the contact (contact.id, not contract_id).
          example: 123
        firstName:
          type: string
          description: Contact first name
          example: John
        lastName:
          type: string
          description: Contact last name
          example: Doe
        email:
          type: string
          description: Contact email address
          example: john.doe@example.com
        phone:
          type: string
          description: Contact phone number
          example: +1 (555) 123-4567
          nullable: true
        title:
          type: string
          description: Contact title/role
          example: Procurement Manager
          nullable: true
      required:
      - id
      - firstName
      - lastName
      - email
    ContractCategoriesResponseDetails:
      type: object
      properties:
        code:
          type: string
          description: The code representing the category.
          example: '20800'
        title:
          type: string
          description: The category code title.
          example: Office Supplies
        codeType:
          type: string
          description: The ID of the category set this category belongs to.
          example: NIGP
      required:
      - code
      - title
      - codeType
    ContractRenewalResponseDetails:
      type: object
      properties:
        length:
          type: number
          description: The length of the renewal period.
          example: 12
        lengthUnit:
          type: string
          description: The unit for the renewal period length.
          example: months
        selected:
          type: boolean
          description: Whether this renewal is selected.
          example: true
      required:
      - length
      - lengthUnit
      - selected
    ErroredContractOrder:
      allOf:
      - $ref: '#/components/schemas/ContractOrder'
      - type: object
        properties:
          errors:
            type: array
            description: List of validation or processing errors for this Contract Order.
            items:
              type: string
              example: 'contractId not found: CONTRACT-12345'
    ContractBudgetResponseDetails:
      type: object
      properties:
        amount:
          type: number
          description: The total budget amount.
          example: 100000
        issued:
          type: number
          description: The amount that has been issued.
          example: 50000
        paid:
          type: number
          description: The amount that has been paid.
          example: 25000
      required:
      - amount
      - issued
      - paid
    ContactsResponseDto:
      type: object
      properties:
        results:
          description: List of contacts associated with the contract
          type: array
          items:
            $ref: '#/components/schemas/ContactResponseDetails'
      required:
      - results
    AttachmentResponseDto:
      type: object
      properties:
        results:
          description: The list of attachments for the contract.
          type: array
          items:
            $ref: '#/components/schemas/AttachmentResponseDetails'
      required:
      - results
    BasicContractDetails:
      type: object
      properties:
        id:
          type: number
          description: The unique identifier for the contract.
          example: 123
        title:
          type: string
          description: The title of the contract.
          example: Annual Office Supply Contract
        startDate:
          type: string
          description: The start date of the contract in ISO 8601.
          example: '2023-07-05T15:25:45.511Z'
        endDate:
          type: string
          description: The end date of the contract in ISO 8601.
          example: '2025-07-05T15:25:45.511Z'
        status:
          type: string
          description: The current status of the contract.
          example: ended
        isPublic:
          type: boolean
          description: Indicates if the contract is public.
          example: true
        isCooperative:
          type: boolean
          description: Indicates if the contract is a cooperative contract.
          example: false
        contractId:
          type: string
          description: The contract identifier string.
          example: CNTR-2023-001
        internalReferenceId:
          type: string
          description: The unique contract identifier per government
          example: '000000001'
        updated_at:
          type: string
          description: The last updated date of the contract in ISO 8601.
          example: '2025-07-05T15:25:45.511Z'
        created_at:
          type: string
          description: The created date of the contract in ISO 8601.
          example: '2025-07-04T15:25:45.511Z'
        departmentName:
          type: string
          description: The name of the department associated with the contract.
          example: Public Works
        durationType:
          type: string
          description: The type of duration for the contract.
          example: fixed
      required:
      - id
      - title
      - startDate
      - endDate
      - status
      - isPublic
      - isCooperative
      - contractId
      - internalReferenceId
      - updated_at
      - created_at
      - departmentName
      - durationType
    ContractByIdResponseDetails:
      type: object
      properties:
        id:
          type: number
          description: The unique identifier for the contract.
          example: 123
        title:
          type: string
          description: The title of the contract.
          example: Annual Office Supply Contract
        startDate:
          type: string
          description: The start date of the contract in ISO 8601.
          example: '2023-07-05T15:25:45.511Z'
        endDate:
          type: string
          description: The end date of the contract in ISO 8601.
          example: '2025-07-05T15:25:45.511Z'
        status:
          type: string
          description: The current status of the contract.
          example: ended
        isPublic:
          type: boolean
          description: Indicates if the contract is public.
          example: true
        isCooperative:
          type: boolean
          description: Indicates if the contract is a cooperative contract.
          example: false
        contractId:
          type: string
          description: The contract identifier string.
          example: CNTR-2023-001
        internalReferenceId:
          type: string
          description: The unique contract identifier per government
          example: '000000001'
        updated_at:
          type: string
          description: The last updated date of the contract in ISO 8601.
          example: '2025-07-05T15:25:45.511Z'
        created_at:
          type: string
          description: The created date of the contract in ISO 8601.
          example: '2025-07-04T15:25:45.511Z'
        departmentName:
          type: string
          description: The name of the department associated with the contract.
          example: Public Works
        durationType:
          type: string
          description: The type of duration for the contract.
          example: fixed
        project_id:
          type: number
          description: The project ID associated with the contract.
          example: 789
        summary:
          type: string
          description: A summary of the contract details.
          example: Supply of office materials for the year.
        state:
          type: string
          description: The current state of the contract.
          example: published
        government_id:
          type: number
          description: The ID of the government entity associated with the contract.
          example: 456
        expirationDate:
          type: string
          description: The expiration date of the contract in ISO 8601.
          example: '2025-07-05T15:25:45.511Z'
        hasProtest:
          type: boolean
          description: Indicates if the contract has a protest on it.
          example: false
        hasClaim:
          type: boolean
          description: Indicates if the contract has a claim on it.
          example: false
        initialTermLength:
          type: number
          description: The initial term length of the contract.
          example: 12
        initialTermLengthUnit:
          type: string
          description: The unit for the initial term length.
          example: months
        procurementClassification:
          type: string
          description: The procurement classification for the contract.
          example: Goods
        note:
          type: string
          description: Additional notes about the contract.
          example: This contract is subject to annual review.
        rebid:
          type: boolean
          description: Indicates if the contract is a rebid.
          example: false
        milestones:
          description: The contract milestones.
          type: array
          items:
            $ref: '#/components/schemas/ContractMilestoneResponseDetails'
        attachments:
          description: The contract attachments.
          type: array
          items:
            $ref: '#/components/schemas/AttachmentResponseDetails'
        vendor:
          description: The vendor (contract party) details.
          allOf:
          - $ref: '#/components/schemas/ContractPartyResponseDetails'
        procurementContact:
          description: The procurement contact details.
          oneOf:
          - $ref: '#/components/schemas/ContractContactResponseDetails'
          - type: 'null'
        projectContact:
          description: The project contact details.
          oneOf:
          - $ref: '#/components/schemas/ContractContactResponseDetails'
          - type: 'null'
        renewals:
          description: The contract renewals.
          type: array
          items:
            $ref: '#/components/schemas/ContractRenewalResponseDetails'
        budget:
          description: The budget details.
          allOf:
          - $ref: '#/components/schemas/ContractBudgetResponseDetails'
        categories:
          description: The category codes associated with the contract.
          type: array
          items:
            $ref: '#/components/schemas/ContractCategoriesResponseDetails'
      required:
      - id
      - title
      - startDate
      - endDate
      - status
      - isPublic
      - isCooperative
      - contractId
      - internalReferenceId
      - updated_at
      - created_at
      - departmentName
      - durationType
      - project_id
      - summary
      - state
      - government_id
      - expirationDate
      - hasProtest
      - hasClaim
      - initialTermLength
      - initialTermLengthUnit
      - procurementClassification
      - note
      - rebid
      - milestones
      - attachments
      - vendor
      - procurementContact
      - projectContact
      - renewals
      - budget
      - categories
    ContractPartyResponseDetails:
      type: object
      properties:
        companyName:
          type: string
          description: The name of the company.
          example: Acme Corp
        companyEmail:
          type: string
          description: The email address of the company.
          example: contact@acmecorp.com
      required:
      - companyName
      - companyEmail
    ContractContactResponseDetails:
      type: object
      properties:
        id:
          type: number
          description: The unique identifier for the contact.
          example: 1
        firstName:
          type: string
          description: The first name of the contact.
          example: John
        lastName:
          type: string
          description: The last name of the contact.
          example: Doe
        title:
          type: string
          description: The title of the contact.
          example: Contract Manager
        phoneCountry:
          type: string
          description: The country code for the contact phone number.
          example: '+1'
        phone:
          type: string
          description: The phone number of the contact.
          example: '1234567890'
        email:
          type: string
          description: The email address of the contact.
          example: john.doe@acme.com
      required:
      - id
      - firstName
      - lastName
      - title
      - phoneCountry
      - phone
      - email
    ContractOrder:
      x-tags:
      - Contracts
      type: object
      required:
      - amount
      - department
      - fiscalYear
      - issueDate
      - number
      - paidAmount
      anyOf:
      - required:
        - contractId
      - required:
        - vendorAssignedNo
      properties:
        amount:
          type: number
          description: The contract order amount.
          example: 1000.5
        contractId:
          type: string
          description: Case sensitive. The ID of the associated contract. Required if `vendorAssignedNo` is not provided. If there are no contract matches or greater than 1 match, the `vendorAssignedNo` will be required.
          maxLength: 255
          example: CONTRACT-12345
        department:
          type: string
          description: Case insensitive. The name of the department making the purchase.
          maxLength: 128
          example: finance
        description:
          type: string
          description: An optional description of the contract order.
          maxLength: 500
          example: Purchase of office supplies.
        fiscalYear:
          type: string
          description: Case insensitive. The fiscal year associated with the contract order.
          maxLength: 256
          example: fy2024-2025
        issueDate:
          type: string
          format: date
          description: The date the contract order was approved and issued. Most common date formats are accepted. Ex. `YYYY-MM-DD` or `MM/DD/YYYY`.
          example: '2023-10-01'
        notes:
          type: string
          description: Optional notes for the contract order.
          maxLength: 500
          example: Urgent request.
        number:
          type: string
          description: Case sensitive. The contract order number.
          maxLength: 64
          example: PO-987654
        paidAmount:
          type: number
          description: The amount that has been paid so far.
          example: 500
        vendorAssignedNo:
          type: string
          description: Case sensitive. The vendor assigned number for this contract order. Required if `contractId` is not provided. If there are no contract matches or greater than 1 match, the `contractId` will be required.
          maxLength: 128
          example: VENDOR-98765
    AttachmentResponseDetails:
      type: object
      properties:
        id:
          type: number
          description: The unique identifier for the attachment.
          example: 1
        filename:
          type: string
          description: The filename of the attachment.
          example: contract.pdf
        fileExtension:
          type: string
          description: The file extension of the attachment.
          example: pdf
        url:
          type: string
          description: The URL where the attachment can be accessed.
          example: https://example.com/contract.pdf
          nullable: true
      required:
      - id
      - filename
      - fileExtension
      - url
    ContractMilestoneResponseDetails:
      type: object
      properties:
        isEndDate:
          type: boolean
          description: Whether this milestone is the end date.
          example: false
        isStartDate:
          type: boolean
          description: Whether this milestone is the start date.
          example: true
        isInsuranceExpiration:
          type: boolean
          description: Whether this milestone is an insurance expiration.
          example: false
        isAnnualEvaluation:
          type: boolean
          description: Whether this milestone is an annual evaluation.
          example: false
        date:
          type: string
          description: The date of the milestone in ISO 8601 format.
          example: '2025-07-05T15:25:45.511Z'
        name:
          type: string
          description: The name of the milestone.
          example: Contract Signed
      required:
      - isEndDate
      - isStartDate
      - isInsuranceExpiration
      - isAnnualEvaluation
      - date
      - name
    ListContractsResponseDto:
      type: object
      properties:
        results:
          description: A list of contracts, each with a cursor for pagination.
          type: array
          items:
            $ref: '#/components/schemas/ContractEdge'
        pageInfo:
          description: Information to assist with pagination.
          allOf:
          - $ref: '#/components/schemas/PageInfo'
      required:
      - results
      - pageInfo
    PageInfo:
      type: object
      properties:
        totalResultsCount:
          type: number
          description: The total number of categories matching the query.
          example: 250
        endCursor:
          type: object
          description: The cursor that points to the last category on the current page.
          example: Y2F0ZWdvcnkuaWQ9MTMz
          nullable: true
        hasMoreResults:
          type: boolean
          description: Indicates whether there are more categories available to fetch.
          example: true
      required:
      - totalResultsCount
      - endCursor
      - hasMoreResults
    ContractEdge:
      type: object
      properties:
        node:
          description: The contract data.
          allOf:
          - $ref: '#/components/schemas/BasicContractDetails'
        cursor:
          type: string
          description: A cursor for use in pagination.
          example: Y29udHJhY3QuaWQ9MTIz
      required:
      - node
      - cursor
  responses:
    MissingProEntitlement:
      description: 'Your OpenGov account does not have OpenGov Procurement access on the requested entity.

        '
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: API key does not have PRO access to this entity
  parameters:
    EntityUuidPathParam:
      name: entityUuid
      in: path
      required: true
      description: 'UUID of the OpenGov entity (typically an agency) the request is acting on. Your OpenGov account must have OpenGov Procurement access on this entity, otherwise a 403 will be returned.

        '
      schema:
        type: string
        format: uuid
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
    xApiKeyHeaderAuth:
      type: apiKey
      in: header
      name: x-api-key
    APIKey:
      type: apiKey
      in: header
      name: Authorization
      description: 'Format: `Token your-api-key-here`'
    BearerToken:
      scheme: bearer
