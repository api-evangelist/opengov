components:
  schemas:
    UUID:
      type: string
      description: a Universally Unique Identifier
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    DateTimeUtc:
      type: string
      description: a string to be decoded into a DateTime.Utc
    Decimal(18,5):
      type: string
      title: Decimal (18,5)
    ReceiptLineItemModel.json:
      type: object
      required:
      - id
      - receiptId
      - createdAt
      - createdBy
      - updatedAt
      - updatedBy
      properties:
        id:
          type: integer
          description: an integer
          title: int
        receiptId:
          type: integer
          description: an integer
          title: int
        ePoId:
          anyOf:
          - type: integer
            description: an integer
            title: int
          - type: 'null'
        ePoLineItemId:
          anyOf:
          - type: integer
            description: an integer
            title: int
          - type: 'null'
        poNumber:
          anyOf:
          - type: string
            description: a string at most 32 character(s) long
            title: maxLength(32)
            maxLength: 32
          - type: 'null'
        description:
          anyOf:
          - type: string
            description: a string at most 2048 character(s) long
            title: maxLength(2048)
            maxLength: 2048
          - type: 'null'
        unitOfMeasure:
          anyOf:
          - type: string
            description: a string at most 64 character(s) long
            title: maxLength(64)
            maxLength: 64
          - type: 'null'
        receivedQuantity:
          anyOf:
          - $ref: '#/components/schemas/Decimal(18,5)'
          - type: 'null'
        acceptedQuantity:
          anyOf:
          - $ref: '#/components/schemas/Decimal(18,5)'
          - type: 'null'
        rejectedQuantity:
          anyOf:
          - $ref: '#/components/schemas/Decimal(18,5)'
          - type: 'null'
        rejectionReason:
          anyOf:
          - type: string
            description: a string at most 2048 character(s) long
            title: maxLength(2048)
            maxLength: 2048
          - type: 'null'
        orderedQuantity:
          anyOf:
          - $ref: '#/components/schemas/Decimal(18,5)'
          - type: 'null'
        previouslyReceivedQuantity:
          anyOf:
          - $ref: '#/components/schemas/Decimal(18,5)'
          - type: 'null'
        additionalNotes:
          anyOf:
          - type: string
            description: a string at most 2048 character(s) long
            title: maxLength(2048)
            maxLength: 2048
          - type: 'null'
        poVersion:
          anyOf:
          - type: integer
            description: an integer
            title: int
          - type: 'null'
        createdAt:
          $ref: '#/components/schemas/DateTimeUtc'
        createdBy:
          type: string
          description: a Universally Unique Identifier
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        updatedAt:
          $ref: '#/components/schemas/DateTimeUtc'
        updatedBy:
          type: string
          description: a Universally Unique Identifier
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      additionalProperties: false
      title: ReceiptLineItemModel.json
    HttpApiDecodeError:
      type: object
      required:
      - issues
      - message
      - _tag
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        message:
          type: string
        _tag:
          type: string
          enum:
          - HttpApiDecodeError
      additionalProperties: false
      description: The request did not match the expected schema
    Issue:
      type: object
      required:
      - _tag
      - path
      - message
      properties:
        _tag:
          type: string
          enum:
          - Pointer
          - Unexpected
          - Missing
          - Composite
          - Refinement
          - Transformation
          - Type
          - Forbidden
          description: The tag identifying the type of parse issue
        path:
          type: array
          items:
            $ref: '#/components/schemas/PropertyKey'
          description: The path to the property where the issue occurred
        message:
          type: string
          description: A descriptive message explaining the issue
      additionalProperties: false
      description: Represents an error encountered while parsing a value to match the schema
    PropertyKey:
      anyOf:
      - type: string
      - type: number
      - type: object
        required:
        - _tag
        - key
        properties:
          _tag:
            type: string
            enum:
            - symbol
          key:
            type: string
        additionalProperties: false
        description: an object to be decoded into a globally shared symbol
    EntityNotFoundError:
      type: object
      required:
      - entityId
      - _tag
      properties:
        entityId:
          type: string
        _tag:
          type: string
          enum:
          - EntityNotFoundError
      additionalProperties: false
    AuthError:
      type: object
      required:
      - _tag
      properties:
        cause:
          $id: /schemas/unknown
          title: unknown
        _tag:
          type: string
          enum:
          - AuthError
      additionalProperties: false
    UnauthorizedError:
      type: object
      required:
      - message
      - _tag
      properties:
        message:
          type: string
        _tag:
          type: string
          enum:
          - UnauthorizedError
      additionalProperties: false
    ConflictError:
      type: object
      required:
      - code
      - message
      - _tag
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: object
          required: []
          properties: {}
          additionalProperties:
            $id: /schemas/unknown
            title: unknown
        _tag:
          type: string
          enum:
          - ConflictError
      additionalProperties: false
      description: Conflict
    ReceiptValidationError:
      type: object
      required:
      - code
      - message
      - _tag
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            required:
            - parameter
            - detail
            properties:
              parameter:
                type: string
              detail:
                type: string
              code:
                type: string
              data:
                type: object
                required: []
                properties: {}
                additionalProperties:
                  $id: /schemas/unknown
                  title: unknown
            additionalProperties: false
        _tag:
          type: string
          enum:
          - ReceiptValidationError
      additionalProperties: false
      description: Validation error
    VisibilityScope:
      type: string
      enum:
      - INTERNAL
      - EXTERNAL
      title: Comment visibility scope
    ActivityLogEntryType:
      type: string
      enum:
      - COMMENT
      - COMMENT_DELETED
      - ATTACHMENT
      - ATTACHMENT_DELETED
      - ATTACHMENT_GROUP
      - ATTACHMENT_TRANSFER_FAILED
      - RECEIPT_SUBMITTED
      - RECEIPT_CANCELLED
      - RECEIPT_APPROVED
      - RECEIPT_REJECTED
      title: Activity log entry type
    UploadStatus:
      type: string
      enum:
      - INITIATED
      - UPLOADED
      - ATTACHED
      - FAILED
      - DELETED
      - PURGED
      title: Attachment upload and link status
    UploadRaw:
      type: object
      required: []
      properties: {}
      additionalProperties:
        $id: /schemas/unknown
        title: unknown
    NumberFromString:
      type: string
      description: a string to be decoded into a number
    SurfaceType:
      type: string
      enum:
      - COMMENTS
      - ATTACHMENTS
      - ACTIVITY_LOG
      description: Type of surface to track versions for
      title: Surface type
  securitySchemes:
    platformApiKey:
      description: OpenGov Platform API Key
      type: apiKey
      name: Authorization
      in: header
    platformBearerToken:
      type: http
      scheme: bearer
