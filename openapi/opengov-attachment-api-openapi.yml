      description: Soft-deletes and removes S3 objects for multiple unlinked attachments in a single request. Only attachments owned by the caller that are not yet linked to a comment or group are eligible. Silently skips ineligible IDs. Used by the frontend to clean up abandoned uploads.
      summary: Bulk-delete orphaned (unlinked) attachments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - attachmentIds
              properties:
                attachmentIds:
                  type: array
                  items:
                    type: number
                  description: an array of at most 20 item(s)
                  title: maxItems(20)
                  minItems: 1
                  maxItems: 20
              additionalProperties: false
        required: true
  /api/v1/po/entities/{entityId}/purchase-orders/{poId}/attachments:
    get:
      tags:
