      description: Returns all attachments in uploadStatus IN ('ATTACHED', 'UPLOADED') for the PO, grouped into `general` and `termsAndConditions` arrays (newest first within each). `storageKey` is omitted from each item (internal). Used by the frontend Copy-PO flow and attachment tiles to avoid walking the activity feed.
      summary: List attachments for a PO, grouped by purpose
components:
  schemas:
    UploadStatus:
      type: string
      enum:
      - INITIATED
      - UPLOADED
      - ATTACHED
      - FAILED
      - DELETED
      - PURGED
      title: Attachment upload and link status
    DateTimeUtc:
      type: string
      description: a string to be decoded into a DateTime.Utc
    NumberFromString:
      type: string
      description: a string to be decoded into a number
    UploadRaw:
      type: object
      required: []
      properties: {}
      additionalProperties:
        $id: /schemas/unknown
        title: unknown
  securitySchemes:
    platformApiKey:
      description: OpenGov Platform API Key
      type: apiKey
      name: Authorization
      in: header
    platformBearerToken:
      type: http
      scheme: bearer
