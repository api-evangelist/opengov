                    description: Human-readable error description. For 400 ValidationError with exactly one field issue, matches that field's `detail`; otherwise a summary (e.g. multiple validation issues).
                    example: An unexpected error occurred while processing your request. Please try again later.
                required:
                - status
                - code
                - detail
      description: Creates a po_attachments row with purpose=GENERAL, upload_status=INITIATED and returns a presigned S3 PUT URL. Client uploads the file directly to S3 via the presigned URL. For Terms & Conditions uploads use POST /terms/attachments/upload instead.
