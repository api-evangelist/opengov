                    example: An unexpected error occurred while processing your request. Please try again later.
                required:
                - status
                - code
                - detail
      description: Deep-copy an existing Purchase Order (header, line items, GL splits, selected attachments) into a new Draft PO. Comments are not copied. Supply attachmentIds to select which attachments to copy; an empty array copies none. Attachments are duplicated via S3 server-side copy; if an individual S3 copy fails the attachment row is soft-deleted and the rest of the copy succeeds. The new PO gets a fresh PO number, today's date, the current fiscal year/period, status = Draft, source = Manual. Financial tracking amounts and state-transition timestamps are reset. Copy is allowed from any source PO status.
      summary: Copy Purchase Order
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                attachmentIds:
                  type: array
                  items:
                    type: number
              additionalProperties: false
        required: true
