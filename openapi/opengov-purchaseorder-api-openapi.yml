      description: 'Create N purchase orders from an approved Purchase Request. Validation and budget checks are hard gates: if any fails, zero POs are created. POs are first created in Draft and committed, then encumbrance is booked and they are promoted to Approved. If encumbrance booking fails, the POs are left in Draft (label Errored) and a non-fatal `ENCUMBRANCE_FAILED` entry is returned in the top-level `warnings` array (HTTP 201) rather than failing the request; the caller must cancel/delete those Draft POs before re-submitting the same PR (a re-submit returns 409 DUPLICATE_PURCHASE_REQUEST while they exist). When the entity admin setting `autoIssueOnPromotion` is true, approved POs are also transitioned to Issued — requires PO_CREATOR and PO_ISSUER claims. If issue fails after approval commits, the POs remain Approved and a non-fatal `AUTO_ISSUE_FAILED` warning is returned. The response `status` field reflects the final PO status (Draft, Approved, or Issued).'
