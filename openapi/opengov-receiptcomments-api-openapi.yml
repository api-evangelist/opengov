components:
  schemas:
    ActivityLogEntryType:
      type: string
      enum:
      - COMMENT
      - COMMENT_DELETED
      - ATTACHMENT
      - ATTACHMENT_DELETED
      - ATTACHMENT_GROUP
      - ATTACHMENT_TRANSFER_FAILED
      - RECEIPT_SUBMITTED
      - RECEIPT_CANCELLED
      - RECEIPT_APPROVED
      - RECEIPT_REJECTED
      title: Activity log entry type
    VisibilityScope:
      type: string
      enum:
      - INTERNAL
      - EXTERNAL
      title: Comment visibility scope
  securitySchemes:
    platformApiKey:
      description: OpenGov Platform API Key
      type: apiKey
      name: Authorization
      in: header
    platformBearerToken:
      type: http
      scheme: bearer
